[project]
name = "smile"
version = "0.1.0"
description = "The Value of Being Wrong: Self-Mined Visual In-Context Learning from Errors (NeurIPS 2026)"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.0",
    "numpy",
    "omegaconf>=2.3.0",
    "Pillow",
    "requests",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm",
    "openai",
]

[tool.uv]
torch-backend = "auto"
